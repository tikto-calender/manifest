apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tikto-dev
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/tikto-calender/manifest.git
  destinations:
    - namespace: tikto-dev
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: argoproj.io
      kind: Rollout
    - group: argoproj.io
      kind: AnalysisTemplate
    - group: elbv2.k8s.aws
      kind: TargetGroupBinding
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tikto-dev
  namespace: argocd
spec:
  project: tikto-dev
  source:
    repoURL: https://github.com/tikto-calender/manifest.git
    targetRevision: main
    path: charts/tikto
    helm:
      valueFiles:
        - environments/dev/values.yaml
        - environments/dev/frontend-image.yaml
        - environments/dev/backend-image.yaml
        - environments/dev/notification-image.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: tikto-dev
  ignoreDifferences:
    - group: ""
      kind: Service
      name: backend-lab-active
      jsonPointers:
        - /spec/selector/rollouts-pod-template-hash
    - group: ""
      kind: Service
      name: backend-lab-preview
      jsonPointers:
        - /spec/selector/rollouts-pod-template-hash
  syncPolicy:
    syncOptions:
      - RespectIgnoreDifferences=true
    automated:
      prune: false
      selfHeal: true
