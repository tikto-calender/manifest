name: Promote Backend (blue/green)
on:
  workflow_dispatch:
    inputs:
      version:
        description: Backend release version, for example v2.0.1.
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  promote:
    uses: tikto-calender/reusable-workflow/.github/workflows/cd-prod-backend.yml@main
    with:
      version: ${{ inputs.version }}
