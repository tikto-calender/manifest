{{- range $name, $slot := .Values.backendSlots }}
{{- $image := required (printf "image is required for %s" $name) (index $.Values $slot.imageKey | default dict).image }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: {{ $.Values.backendReplicas }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      {{- include "tikto.backendPodSpec" (dict "values" $.Values "name" $name "image" $image) | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: {{ $name }}
spec:
  targetType: ip
  targetGroupName: {{ $slot.targetGroup | quote }}
  serviceRef:
    name: {{ $name }}
    port: http
{{ end }}
