apiVersion: v1
kind: ServiceAccount
metadata:
  name: tikto-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: tikto-app
      containers:
        - name: tikto
          image: tikto/backend:replace-me
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
          env:
            - name: STORE_BACKEND
              value: dynamodb
            - name: AWS_REGION
              value: ap-southeast-2
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification:8000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: http
