name: Promote Backend (blue/green)
on:
  workflow_dispatch:
    inputs:
      version:
        description: Backend release version, for example v2.0.1.
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: promote-backend
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, tikto-prod-preview]
    timeout-minutes: 25
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: manifest

      - uses: actions/checkout@v4
        with:
          repository: tikto-calender/reusable-workflow
          ref: main
          path: workflow-tools
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BACKEND_RELEASE_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Stage, verify and switch the Backend
        working-directory: manifest
        env:
          PYTHONPATH: ${{ github.workspace }}/workflow-tools/scripts
          VERSION: ${{ inputs.version }}
          DEV_URL: ${{ vars.BACKEND_DEV_URL }}
          APP_URL: ${{ vars.BACKEND_RELEASE_URL }}
          RULE_ARN: ${{ vars.BACKEND_RELEASE_RULE_ARN }}
          BLUE_ARN: ${{ vars.BACKEND_RELEASE_BLUE_ARN }}
          GREEN_ARN: ${{ vars.BACKEND_RELEASE_GREEN_ARN }}
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: "4"
        run: python3 scripts/backend_release.py
